<section class="main">
  <div class="survey_card">
    <div class="card_header">
      <img class="status_badge" src="images/survey_Status/draft.png" alt="Draft" />

      <h1>Create new survey</h1>

      <a class="cancel_btn" routerLink="/home" aria-label="Cancel">
        <img src="images/Secpondary button.png" alt="">
      </a>
    </div>

    <section class="inputs">
      <div class="inputs__grid">

        <div class="inputs__column">
          <div class="field">
            <label class="field_label" for="survey_name">Survey name</label>
            <div class="field_row">
              <input class="field_input" id="survey_name" type="text">
              <button class="field_clear" type="button" aria-label="Clear survey name"></button>
            </div>
          </div>

          <div class="field_line">
            <div class="field field--date">
              <label class="field_label" for="survey_end_date">
                Set end date <span class="field_hint">(optional)</span>
              </label>
              <div class="field_row">
                <input class="field_input" id="survey_end_date" type="text">
                <button class="field_clear" type="button" aria-label="Clear end date"></button>
              </div>
            </div>

            <button class="category_btn" type="button" aria-haspopup="menu" aria-expanded="false">
              Choose category
              <span class="category_btn_arrow" aria-hidden="true"></span>
            </button>
          </div>
        </div>

        <div class="field field--description">
          <label class="field_label" for="survey_description">
            Describing text <span class="field_hint">(optional)</span>
          </label>
          <div class="field_row field_row--top">
            <textarea class="field_input field_input--area" id="survey_description" rows="4"></textarea>
            <button class="field_clear" type="button" aria-label="Clear describing text"></button>
          </div>
        </div>

        <div class="question">
          <div class="question__head">
            <label class="field_label" for="question_1">1. Question</label>
            <button class="field_clear" type="button" aria-label="Delete question 1"></button>
          </div>

          <div class="field_row">
            <input class="field_input" id="question_1" type="text"
                   placeholder="Which date would work best for you?">
          </div>

          <div class="answers">
            <div class="answers__head">
              <span class="field_label">Answers</span>

              <label class="checkbox">
                <input class="checkbox__input" type="checkbox">
                <span class="checkbox__box" aria-hidden="true"></span>
                <span class="checkbox__text">Allow multiple answers.</span>
              </label>
            </div>

            <div class="answer">
              <span class="answer__letter" aria-hidden="true">A.</span>
              <input class="field_input" type="text" aria-label="Answer A">
              <button class="field_clear" type="button" aria-label="Delete answer A"></button>
            </div>

            <div class="answer">
              <span class="answer__letter" aria-hidden="true">B.</span>
              <input class="field_input" type="text" aria-label="Answer B">
              <button class="field_clear" type="button" aria-label="Delete answer B"></button>
            </div>

            <button class="add_answer_btn" type="button" aria-label="Add answer"></button>
          </div>
        </div>

        <button class="add_question_btn" type="button" aria-label="Add next question"></button>

      </div>
    </section>
    <button class="publish"></button>
  </div>
</section>
